{% extends "resellers/_base.html" %}{% block title %}Crear cuenta{% endblock %}{% block content %}<section class="reseller-auth-card is-wide"><span class="reseller-auth-eyebrow">NUEVA CUENTA</span><h1>Conviértete en revendedor</h1><p>Tu cuenta quedará activa inmediatamente después del registro.</p>{% if error %}<div class="reseller-auth-message">{{ error }}</div>{% endif %}<form method="POST" class="reseller-auth-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Nombre completo<input name="nombre" maxlength="120" required autofocus></label><label>Negocio <small>Opcional</small><input name="negocio" maxlength="120"></label><label>Correo<input name="correo" type="email" maxlength="254" autocomplete="username" required></label><label>WhatsApp / teléfono<input name="telefono" type="tel" maxlength="21"></label><label>Contraseña<input name="password" type="password" minlength="10" autocomplete="new-password" required><small>Mínimo 10 caracteres, con letras y números.</small></label><label>Confirmar contraseña<input name="confirmar_password" type="password" minlength="10" autocomplete="new-password" required></label><button type="submit">Crear mi cuenta</button></form><footer>¿Ya tienes cuenta? <a href="/revendedores/login">Iniciar sesión</a></footer></section>{% endblock %}

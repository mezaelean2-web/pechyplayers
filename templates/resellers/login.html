{% extends "resellers/_base.html" %}{% block title %}Iniciar sesión{% endblock %}{% block content %}<section class="reseller-auth-card"><span class="reseller-auth-eyebrow">PORTAL RESELLER</span><h1>Bienvenido de nuevo</h1><p>Accede al catálogo de siempre con tus precios reseller.</p>{% if error %}<div class="reseller-auth-message">{{ error }}</div>{% endif %}<form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Correo<input name="correo" type="email" autocomplete="username" required autofocus></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Iniciar sesión</button></form><footer>¿Aún no tienes cuenta? <a href="/revendedores/registro">Crear cuenta de revendedor</a></footer></section>{% endblock %}
